syntax = "proto3";

package task.v1;

option go_package = "g.nas.loc/Okoteka/memu-contracts/gen/task/v1;taskv1";

import "google/protobuf/timestamp.proto";

enum TaskStatus {
	TASK_STATUS_UNSPECIFIED = 0;
	TASK_STATUS_PENDING = 1;
	TASK_STATUS_DOWNLOADING = 2;
	TASK_STATUS_COMPLETED = 3;
	TASK_STATUS_FAILED = 4;
}

message Task {
	string task_id = 1;
	int64 chat_id = 2;
	int64 user_id = 3;
	string url = 4;

	TaskStatus status = 5;

	google.protobuf.Timestamp created_at = 6;
	google.protobuf.Timestamp started_at = 7;
	google.protobuf.Timestamp updated_at = 8;
	google.protobuf.Timestamp finished_at = 9;

	int32 progress_percent = 10;

	string error_message = 11;
	int32 attempt = 12;
}

message CreateTaskRequest {
	int64 chat_id = 1;
	int64 user_id = 2;
	string url = 3;
}

message CreateTaskResponse {
	Task task = 1;
}

message UpdateTaskStatusRequest {
	string task_id = 1;
	TaskStatus status = 2;
}

message UpdateTaskStatusResponse {
	Task task = 1;
}

message UpdateTaskProgressRequest {
	string task_id = 1;
	int32 progress_percent = 2;
}

message UpdateTaskProgressResponse {
	Task task = 1;
}

message GetTaskRequest {
	string task_id = 1;
}

message GetTaskResponse {
	Task task = 1;
}

message ListTasksByChatRequest {
	int64 chat_id = 1;
}

message ListTasksByChatResponse {
	repeated Task tasks = 1;
}

service TaskService {
	rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
	rpc UpdateTaskStatus(UpdateTaskStatusRequest) returns (UpdateTaskStatusResponse);
	rpc UpdateTaskProgress(UpdateTaskProgressRequest) returns (UpdateTaskProgressResponse);

	rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
	rpc ListTasksByChat(ListTasksByChatRequest) returns (ListTasksByChatResponse);
}
